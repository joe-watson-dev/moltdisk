# Builds MoltDisk.app and publishes it as a GitHub release whenever the app changes on main.
# The landing page links to releases/latest/download/MoltDisk.zip, so it always serves the newest build.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
      - "scripts/build-app.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      BUILD: "${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # First release is 1.0.0; each later one bumps the patch number of the newest v* tag.
      - name: Pick the version
        run: |
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            next=1.0.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "VERSION=$next" >> "$GITHUB_ENV"
          echo "Releasing $next (previous: ${last:-none})"

      - name: Build MoltDisk.app
        run: ./scripts/build-app.sh

      - name: Zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent MoltDisk.app MoltDisk.zip
          shasum -a 256 MoltDisk.zip | tee MoltDisk.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/MoltDisk.zip build/MoltDisk.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "MoltDisk $VERSION" \
            --latest \
            --generate-notes \
            --notes "macOS 15 or later, Apple silicon. Not notarized: the first time, open System Settings › Privacy & Security and click Open Anyway."
